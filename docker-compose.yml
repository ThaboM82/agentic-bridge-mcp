version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: agentic_bridge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_bridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_bridge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentic_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic_bridge_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agentic_bridge
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agentic_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic_bridge_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - agentic_net

volumes:
  postgres_data:
    driver: local

networks:
  agentic_net:
    driver: bridge